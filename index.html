<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог товаров</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f0f0f;
      --card-bg: #1a1a1a;
      --text-color: #ffffff;
      --accent-color: #e6e6e6;
      --btn-bg: #ffffff;
      --btn-text: #000000;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 30px;
    }

    /* Шапка */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      background: var(--bg-color);
      z-index: 100;
    }

    .logo {
      font-weight: 900;
      font-size: 1.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .nav-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    /* Валюта */
    .currency-bar {
      display: flex;
      justify-content: flex-end;
      padding: 10px 20px 0;
    }

    .currency-switch {
      display: flex;
      background: var(--card-bg);
      border-radius: 6px;
      padding: 2px;
    }

    .currency-btn {
      border: none;
      background: none;
      color: #888;
      padding: 4px 10px;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
    }

    .currency-btn.active {
      background: var(--accent-color);
      color: #000;
    }

    /* Каталог товаров */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 15px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid var(--border-color);
    }

    .card img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
    }

    .card-info {
      padding: 10px;
    }

    .card-title {
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .card-price {
      font-size: 0.85rem;
      color: #aaa;
    }

    /* Модальные окна */
    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 200;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: var(--bg-color);
      width: 100%;
      max-height: 90vh;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      overflow-y: auto;
      border-top: 1px solid var(--border-color);
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #888;
    }

    /* Слайдер доп. фото */
    .gallery {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 15px;
    }

    .gallery img {
      width: 200px;
      height: 260px;
      object-fit: cover;
      border-radius: 8px;
    }

    /* Размеры */
    .sizes {
      display: flex;
      gap: 10px;
      margin: 15px 0;
    }

    .size-btn {
      padding: 8px 16px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
    }

    .size-btn.selected {
      background: var(--btn-bg);
      color: var(--btn-text);
      font-weight: bold;
    }

    .action-btn {
      width: 100%;
      padding: 14px;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }

    /* Корзина и форма */
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .form-group {
      margin-top: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #aaa;
      margin-bottom: 5px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      outline: none;
    }

    .info-block {
      margin-top: 25px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
      font-size: 0.8rem;
      color: #888;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <header>
    <button class="nav-btn" onclick="showCatalog()">Каталог</button>
    <div class="logo">ASTO</div>
    <button class="nav-btn" onclick="openCart()">Корзина (<span id="cart-count">0</span>)</button>
  </header>

  <div class="currency-bar">
    <div class="currency-switch">
      <button class="currency-btn active" id="btn-byn" onclick="setCurrency('BYN')">BYN</button>
      <button class="currency-btn" id="btn-rub" onclick="setCurrency('RUB')">RUB</button>
    </div>
  </div>

  <!-- Витрина товаров -->
  <div class="grid" id="product-grid"></div>

  <!-- Модалка детального просмотра товара -->
  <div class="modal" id="product-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('product-modal')">&times;</span>
      <div class="gallery" id="modal-gallery"></div>
      <h2 id="modal-title"></h2>
      <p id="modal-price" style="margin: 10px 0; color: #aaa;"></p>
      <p id="modal-desc" style="font-size: 0.9rem; line-height: 1.4;"></p>

      <div style="margin-top: 15px;">
        <label style="font-size: 0.85rem; color: #aaa;">Выберите размер:</label>
        <div class="sizes" id="modal-sizes"></div>
      </div>

      <button class="action-btn" onclick="addToCart()">Добавить в корзину</button>
    </div>
  </div>

  <!-- Модалка корзины -->
  <div class="modal" id="cart-modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('cart-modal')">&times;</span>
      <h2>Корзина</h2>
      <div id="cart-items" style="margin-top: 15px;"></div>

      <form id="order-form" style="margin-top: 20px;">
        <div class="form-group">
          <label>ФИО</label>
          <input type="text" id="fio" required placeholder="Иванов Иван Иванович">
        </div>
        <div class="form-group">
          <label>Номер телефона</label>
          <input type="tel" id="phone" required placeholder="+375 / +7 ...">
        </div>
        <div class="form-group">
          <label>Страна</label>
          <input type="text" id="country" required placeholder="Беларусь / Россия">
        </div>
        <div class="form-group">
          <label>Город</label>
          <input type="text" id="city" required placeholder="Минск / Москва">
        </div>
        <div class="form-group">
          <label>Адрес ПВЗ СДЭК (РФ) / Европочты (РБ)</label>
          <input type="text" id="address" required placeholder="Укажите адрес отделения">
        </div>
        <div class="form-group">
          <label>Username Telegram</label>
          <input type="text" id="telegram" required placeholder="@username">
        </div>
        <div class="form-group">
          <label>Комментарий</label>
          <textarea id="comment" rows="2" placeholder="Пожелания к заказу"></textarea>
        </div>

        <button type="button" class="action-btn" onclick="submitOrder()">Оформить заказ</button>
      </form>

      <div class="info-block">
        <strong>Условия доставки и возврата:</strong><br>
        • Доставка осуществляется через СДЭК (по РФ) и Европочту (по РБ).<br>
        • Сроки отправки: 1–3 рабочих дня с момента подтверждения оплаты.<br>
        • Возврат и обмен возможен в течение 14 дней с момента получения при сохранении товарного вида.
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Курс конвертации (1 BYN = 29.5 RUB)
    const EXCHANGE_RATE = 29.5; 
    let currentCurrency = 'BYN';
    let currentProduct = null;
    let selectedSize = null;
    let cart = [];

    const products = [
      {
        id: 1,
        name: "Matte Black Jacket",
        priceBYN: 280,
        desc: "Матовая куртка плотного кроя с объёмной вышивкой и прорезиненными элементами.",
        images: [
          "https://via.placeholder.com/400x533/1a1a1a/ffffff?text=Main+Photo",
          "https://via.placeholder.com/400x533/222222/ffffff?text=Detail+1",
          "https://via.placeholder.com/400x533/333333/ffffff?text=Detail+2"
        ],
        sizes: ["S", "M", "L", "XL"]
      },
      {
        id: 2,
        name: "Distressed Beanie Grey",
        priceBYN: 90,
        desc: "Шапка с эффектом потертости и вышитыми патчами.",
        images: [
          "https://via.placeholder.com/400x533/252525/ffffff?text=Beanie+Main",
          "https://via.placeholder.com/400x533/353535/ffffff?text=Beanie+Detail"
        ],
        sizes: ["ONE SIZE"]
      }
    ];

    function renderProducts() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';
      products.forEach(p => {
        const price = currentCurrency === 'BYN' 
          ? `${p.priceBYN} BYN` 
          : `${Math.round(p.priceBYN * EXCHANGE_RATE)} RUB`;

        grid.innerHTML += `
          <div class="card" onclick="openProduct(${p.id})">
            <img src="${p.images[0]}" alt="${p.name}">
            <div class="card-info">
              <div class="card-title">${p.name}</div>
              <div class="card-price">${price}</div>
            </div>
          </div>
        `;
      });
    }

    function setCurrency(curr) {
      currentCurrency = curr;
      document.getElementById('btn-byn').classList.toggle('active', curr === 'BYN');
      document.getElementById('btn-rub').classList.toggle('active', curr === 'RUB');
      renderProducts();
      updateCartDisplay();
    }

    function openProduct(id) {
      currentProduct = products.find(p => p.id === id);
      selectedSize = null;

      document.getElementById('modal-title').innerText = currentProduct.name;
      document.getElementById('modal-desc').innerText = currentProduct.desc;
      
      const price = currentCurrency === 'BYN' 
        ? `${currentProduct.priceBYN} BYN` 
        : `${Math.round(currentProduct.priceBYN * EXCHANGE_RATE)} RUB`;
      document.getElementById('modal-price').innerText = price;

      const gallery = document.getElementById('modal-gallery');
      gallery.innerHTML = currentProduct.images.map(img => `<img src="${img}">`).join('');

      const sizesDiv = document.getElementById('modal-sizes');
      sizesDiv.innerHTML = currentProduct.sizes.map(size => 
        `<button class="size-btn" onclick="selectSize(this, '${size}')">${size}</button>`
      ).join('');

      document.getElementById('product-modal').classList.add('active');
    }

    function selectSize(btn, size) {
      document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedSize = size;
    }

    function addToCart() {
      if (!selectedSize) {
        alert('Пожалуйста, выберите размер!');
        return;
      }
      cart.push({ ...currentProduct, size: selectedSize });
      updateCartCount();
      closeModal('product-modal');
    }

    function updateCartCount() {
      document.getElementById('cart-count').innerText = cart.length;
    }

    function openCart() {
      updateCartDisplay();
      document.getElementById('cart-modal').classList.add('active');
    }

    function updateCartDisplay() {
      const container = document.getElementById('cart-items');
      if (cart.length === 0) {
        container.innerHTML = '<p style="color: #666;">Корзина пуста</p>';
        return;
      }

      container.innerHTML = cart.map((item, index) => {
        const price = currentCurrency === 'BYN' 
          ? `${item.priceBYN} BYN` 
          : `${Math.round(item.priceBYN * EXCHANGE_RATE)} RUB`;
        return `
          <div class="cart-item">
            <div>
              <div><strong>${item.name}</strong></div>
              <div style="font-size:0.8rem; color:#aaa;">Размер: ${item.size}</div>
            </div>
            <div>
              <span>${price}</span>
              <button onclick="removeFromCart(${index})" style="background:none; border:none; color:red; margin-left:10px; cursor:pointer;">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartCount();
      updateCartDisplay();
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function submitOrder() {
      if (cart.length === 0) {
        alert('Ваша корзина пуста');
        return;
      }

      const fio = document.getElementById('fio').value;
      const phone = document.getElementById('phone').value;
      const country = document.getElementById('country').value;
      const city = document.getElementById('city').value;
      const address = document.getElementById('address').value;
      const telegram = document.getElementById('telegram').value;
      const comment = document.getElementById('comment').value;

      if (!fio || !phone || !country || !city || !address || !telegram) {
        alert('Пожалуйста, заполните все обязательные поля.');
        return;
      }

      const orderData = {
        customer: { fio, phone, country, city, address, telegram, comment },
        currency: currentCurrency,
        items: cart.map(i => ({ name: i.name, size: i.size, price: i.priceBYN }))
      };

      // Отправляем данные бота через WebApp API
      tg.sendData(JSON.stringify(orderData));
      tg.close();
    }

    renderProducts();
  </script>
</body>
</html>
