<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASTO STUDIO // EXECUTABLE</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --window-border: #444;
      --text-color: #ffffff;
      --dim-text: #888888;
      --accent: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: monospace, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 50px;
      overflow-x: hidden;
    }

    /* Шапка в стиле ОС / Андеграунд */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      border-bottom: 2px solid var(--window-border);
      background: #0a0a0a;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-link {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 0.85rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-link:hover {
      text-decoration: underline;
    }

    /* Крупный белый логотип по центру */
    .central-logo {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    .central-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Переключатель валют */
    .currency-bar {
      display: flex;
      justify-content: flex-end;
      padding: 10px 15px;
    }

    .currency-switch {
      display: flex;
      border: 1px solid var(--window-border);
      background: #111;
    }

    .currency-btn {
      border: none;
      background: none;
      color: var(--dim-text);
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: bold;
    }

    .currency-btn.active {
      background: var(--text-color);
      color: #000;
    }

    /* Сетка товаров (Окна) */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 15px;
    }

    @media (max-width: 480px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    /* Стилизация карточки под окно программы */
    .win-window {
      background: var(--card-bg);
      border: 1px solid var(--window-border);
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      margin-bottom: 15px;
    }
